name: PR CI Reviewers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_input:
        description: 'PR number or URL (e.g., "123" or "https://github.com/owner/repo/pull/123")'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dispatch-angie-dev-tools
        with:
          workflow: pr-ci-reviewers.yml
          token: ${{ secrets.ANGIE_DEV_TOOLS_BOT_TOKEN }}
