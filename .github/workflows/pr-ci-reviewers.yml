name: PR CI Reviewers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_input:
        description: 'PR number or URL (e.g., "123" or "https://github.com/owner/repo/pull/123")'
        required: true
        type: string

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  reviewers:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dispatch-angie-dev-tools
        env:
          GH_TOKEN: ${{ secrets.ANGIE_DEV_TOOLS_BOT_TOKEN }}
        with:
          workflow: pr-ci-reviewers.yml

  approver:
    needs: reviewers
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dispatch-angie-dev-tools
        env:
          GH_TOKEN: ${{ secrets.ANGIE_DEV_TOOLS_BOT_TOKEN }}
        with:
          workflow: pr-ci-approver.yml
          wait_for_other_checks: 'true'
