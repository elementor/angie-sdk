name: Publish Beta to NPM

on:
  workflow_dispatch:
    inputs:
      preid:
        description: 'Pre-release identifier (e.g. beta, alpha, rc)'
        required: false
        default: 'beta'
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Set beta version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          BETA_VERSION="${BASE_VERSION}-${{ github.event.inputs.preid }}.${{ github.run_number }}"
          npm version "$BETA_VERSION" --no-git-tag-version
          echo "Publishing version: $BETA_VERSION"

      - name: Publish beta to npm
        run: npm publish --tag ${{ github.event.inputs.preid }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish beta to GitHub Packages
        run: |
          echo "@elementor:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          npm publish --tag ${{ github.event.inputs.preid }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only succeeds when dispatched from master — public-repos-pool's attribute_condition
      # requires assertion.ref == 'refs/heads/master' for this repo's non-release runs.
      - name: Authenticate to Google Artifact Registry
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/165476505383/locations/global/workloadIdentityPools/public-repos-pool/providers/github-provider'
          service_account: 'github-actions-public-sa@elementor-infra.iam.gserviceaccount.com'
          token_format: access_token

      - name: Publish beta to Artifact Registry
        env:
          GAR_REGISTRY: https://us-npm.pkg.dev/elementor-infra/npm-packages/
        run: |
          rm -f .npmrc
          npm config set --location user "@elementor:registry" "$GAR_REGISTRY"
          npm config set --location user "${GAR_REGISTRY#https:}:_authToken" "${{ steps.gcp-auth.outputs.access_token }}"
          npm publish --tag ${{ github.event.inputs.preid }} --registry="$GAR_REGISTRY" --access public
