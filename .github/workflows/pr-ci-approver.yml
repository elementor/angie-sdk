name: PR CI Approver

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_input:
        description: 'PR number or URL (e.g., "123" or "https://github.com/owner/repo/pull/123")'
        required: true
        type: string
      dry_run:
        description: 'Log verdict without posting a PR comment'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: ./.github/actions/dispatch-angie-dev-tools
        env:
          GH_TOKEN: ${{ secrets.ANGIE_DEV_TOOLS_BOT_TOKEN }}
        with:
          workflow: pr-ci-approver.yml
          dry_run: ${{ github.event.inputs.dry_run }}
