name: PR CI Approver

on:
  workflow_dispatch:
    inputs:
      pr_input:
        description: 'PR number or URL (e.g., "123" or "https://github.com/owner/repo/pull/123")'
        required: true
        type: string
      dry_run:
        description: 'Log verdict without posting a PR comment'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dispatch-angie-dev-tools
        env:
          GH_TOKEN: ${{ secrets.ANGIE_DEV_TOOLS_BOT_TOKEN }}
        with:
          workflow: pr-ci-approver.yml
          dry_run: ${{ github.event.inputs.dry_run }}
          wait_for_other_checks: 'true'
