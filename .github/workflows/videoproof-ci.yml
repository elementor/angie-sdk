name: Videoproof-CI

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  videoproof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start demo
        run: |
          npx --yes serve . -l 8080 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/demo/load-sidebar-v2-full-config/ >/dev/null; then
              echo "Demo is up"
              exit 0
            fi
            sleep 1
          done
          echo "Demo server did not start" >&2
          exit 1

      - name: Clone videoproof kit
        env:
          GH_TOKEN: ${{ secrets.ANGIE_DEV_TOOLS_BOT_TOKEN }}
          VIDEO_PROOF_KIT_REF: ${{ vars.VIDEO_PROOF_KIT_REF || 'master' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ANGIE_DEV_TOOLS_BOT_TOKEN is required to clone elementor/angie-dev-tools." >&2
            exit 1
          fi
          gh repo clone elementor/angie-dev-tools "$RUNNER_TEMP/angie-dev-tools" -- --depth 1 --branch "$VIDEO_PROOF_KIT_REF"

      - name: Run videoproof
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
          VIDEO_PROOF_URL: http://127.0.0.1:8080/demo/load-sidebar-v2-full-config/
          VIDEO_PROOF_TASK_FILE: ${{ github.workspace }}/.github/videoproof-task.txt
          VIDEO_PROOF_NOTE: Clicked **Ask Angie** to open the loadSidebarV2 sidebar on the product editor POC.
          VIDEO_PROOF_POST_COMMENT: ${{ github.event_name == 'pull_request' }}
        run: bash "$RUNNER_TEMP/angie-dev-tools/videoproof/run.sh"

      - name: Upload videoproof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videoproof
          path: |
            prove-results/
            proof-artifacts/
          if-no-files-found: ignore
          retention-days: 14
