name: CodeMender AI Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  codemender-scan:
    uses: elementor/elementor-cloud-github-actions/.github/workflows/codemender-scan.yaml@master
    with:
      environment: prod
      fail_on: CRITICAL,HIGH
    secrets: inherit
