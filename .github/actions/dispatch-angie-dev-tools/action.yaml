name: 'Dispatch angie-dev-tools workflow'
description: 'Trigger a private angie-dev-tools workflow with the current PR context and wait for it to finish'

inputs:
  workflow:
    description: 'Workflow filename in elementor/angie-dev-tools'
    required: true
  dry_run:
    description: 'Optional dry_run input for the approver workflow'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Dispatch workflow
      shell: bash
      env:
        WORKFLOW: ${{ inputs.workflow }}
        DRY_RUN: ${{ inputs.dry_run }}
        PR_INPUT: ${{ github.event.pull_request.html_url || github.event.inputs.pr_input }}
        REPOSITORY: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "ANGIE_DEV_TOOLS_BOT_TOKEN is required to dispatch private angie-dev-tools workflows." >&2
          exit 1
        fi
        if [ -z "$PR_INPUT" ]; then
          echo "PR URL or number is required." >&2
          exit 1
        fi

        if [ "$EVENT_NAME" = "pull_request" ]; then
          if [ "$PR_HEAD_REPO" != "$REPOSITORY" ]; then
            echo "Skipping fork PR dispatch."
            exit 0
          fi
        elif [[ "$PR_INPUT" =~ ^https://github\.com/([^/]+)/([^/]+)/pull/([0-9]+)/?$ ]]; then
          URL_REPO="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
          PR_NUM="${BASH_REMATCH[3]}"
          if [ "$URL_REPO" != "$REPOSITORY" ]; then
            echo "Refusing to dispatch a PR from another repository: $URL_REPO" >&2
            exit 1
          fi
          HEAD_REPO="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUM}" --jq .head.repo.full_name)"
          if [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            echo "Refusing to dispatch a fork PR: ${HEAD_REPO}" >&2
            exit 1
          fi
        else
          echo "workflow_dispatch requires a full PR URL on this repository." >&2
          exit 1
        fi

        ARGS=(
          -f "pr_input=${PR_INPUT}"
          -f "target_repository=${REPOSITORY}"
        )
        if [ -n "$DRY_RUN" ] && [ "$WORKFLOW" = "pr-ci-approver.yml" ]; then
          ARGS+=(-f "dry_run=${DRY_RUN}")
        fi

        SINCE="$(date -u -d '5 seconds ago' +%Y-%m-%dT%H:%M:%SZ)"

        gh workflow run "$WORKFLOW" \
          --repo elementor/angie-dev-tools \
          --ref master \
          "${ARGS[@]}"

        echo "Dispatched ${WORKFLOW} on elementor/angie-dev-tools for ${PR_INPUT}"

        RUN_ID=""
        for _ in $(seq 1 30); do
          RUN_ID="$(gh run list \
            --repo elementor/angie-dev-tools \
            --workflow "$WORKFLOW" \
            --event workflow_dispatch \
            --limit 10 \
            --json databaseId,createdAt \
            --jq --arg since "$SINCE" \
              '[.[] | select(.createdAt >= $since)] | first | .databaseId // empty')"
          if [ -n "$RUN_ID" ]; then
            break
          fi
          sleep 2
        done

        if [ -z "$RUN_ID" ]; then
          echo "Timed out waiting for dispatched ${WORKFLOW} run to appear." >&2
          exit 1
        fi

        echo "Waiting for ${WORKFLOW} run ${RUN_ID}"
        gh run watch "$RUN_ID" --repo elementor/angie-dev-tools --exit-status --interval 10
